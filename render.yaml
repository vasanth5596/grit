services:
  - type: web
    name: grit-interview-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ORIGINS
        sync: false
